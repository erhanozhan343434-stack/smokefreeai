name: Validate Flutter Changes

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify committed lockfile
        run: git diff --exit-code -- pubspec.lock
      - name: Generate translations
        run: flutter gen-l10n
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build installable debug APK (not for Play upload)
        run: flutter build apk --debug
      - name: Build unsigned release bundle (compile verification only)
        env:
          ORG_GRADLE_PROJECT_smokefreeUnsignedAudit: 'true'
        run: flutter build appbundle --release
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-billing-audit-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            pubspec.lock
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
