name: Deploy Firebase Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Write credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/gcp-key.json"
          printf '%s' "$GEMINI_API_KEY" > "$HOME/gemini-key.txt"

      - name: Set Gemini secret in Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: |
          npx firebase-tools@latest functions:secrets:set GEMINI_API_KEY \
            --project smokefreeai-99f98 \
            --data-file "$HOME/gemini-key.txt" \
            --non-interactive

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: npx firebase-tools@latest deploy --only functions --project smokefreeai-99f98 --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "$HOME/gcp-key.json" "$HOME/gemini-key.txt"
