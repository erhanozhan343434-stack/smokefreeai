name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/paywall-analytics-20261105
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Bağımlılık kilidini doğrula
        run: git diff --exit-code -- pubspec.lock

      - name: Flutter kontrolleri
        run: |
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test

      - name: Keystore dosyasını oluştur
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Android signing configuration is incomplete; no candidate was signed.')
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          Path('android/upload-keystore.jks').write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          Path('android/key.properties').write_text('\n'.join((
              'storePassword=' + prop(os.environ[names[1]]),
              'keyPassword=' + prop(os.environ[names[2]]),
              'keyAlias=' + prop(os.environ[names[3]]),
              'storeFile=upload-keystore.jks',
          )) + '\n')
          PY

      - name: AAB oluştur
        run: flutter build appbundle --release

      - name: AAB dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: APK oluştur (ekran görüntüsü için)
        run: flutter build apk --release
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Geçici imzalama dosyalarını kaldır
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
