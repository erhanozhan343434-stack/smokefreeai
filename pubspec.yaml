name: smokefree
description: SmokeFree AI — quit smoking companion with live counters and AI coaching.
publish_to: 'none'
version: 0.1.0+9

environment:
  # bootstrap.sh çalıştıktan sonra kurulu Flutter SDK'ya göre daraltılır.
  sdk: '>=3.0.0 <4.0.0'

# DİKKAT: bağımlılıklar burada ELLE yazılmaz.
# `./bootstrap.sh` -> `flutter pub add` ile pub.dev'den gerçek sürümler çözülür.
dependencies:
  cloud_functions: 6.3.6
  collection: ^1.19.1
  csv: ^8.0.0
  device_info_plus: ^13.2.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  firebase_app_check: 0.4.6
  firebase_auth: 6.5.7
  firebase_core: 4.13.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  health: ^13.3.2
  home_widget: ^0.9.3
  intl: ^0.20.3
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  purchases_flutter: 10.6.0
  purchases_ui_flutter: 10.6.0  
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true          # gen-l10n aktif
flutter_launcher_icons:
  image_path: "icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "icon_foreground.png"

flutter_native_splash:
  color: "#06080C"
  image: "icon_foreground.png"
  android_12:
    image: "icon_foreground.png"
    icon_background_color: "#06080C"
